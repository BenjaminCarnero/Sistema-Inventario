name: Tests

# Con instancias desplegadas en comercios, romper algo sin enterarse deja de
# ser un susto y pasa a ser un llamado a las nueve de la mañana.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Tests (sólo API, sin frontend compilado)
        run: pytest -q
        env:
          # La misma configuración que usa conftest.py, por si algún test
          # llegara a leerla antes de que se cree la base temporal.
          SECRET_KEY: clave-solo-para-ci-no-usar-en-produccion
          ENTORNO: desarrollo

      # La aplicación se comporta distinto según haya o no un frontend
      # compilado al lado: con `dist/index.html` presente se registra el
      # catch-all que sirve el SPA, y ese es el código que corre en producción.
      #
      # CI sólo probaba el caso sin compilar, así que ocho tests de seguridad
      # daban verde en verde sobre una configuración que en ningún comercio
      # existe: el catch-all había dejado a toda la API sin sus 404 y nadie se
      # enteró. Alcanza con un index de mentira para activar ese camino.
      - name: Simular un frontend compilado
        run: |
          mkdir -p ../frontend/dist
          echo '<!doctype html><title>index de prueba</title>' > ../frontend/dist/index.html

      - name: Tests (con frontend compilado, que es como corre en producción)
        run: pytest -q
        env:
          SECRET_KEY: clave-solo-para-ci-no-usar-en-produccion
          ENTORNO: desarrollo

      - name: Las migraciones llegan hasta la última
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: clave-solo-para-ci-no-usar-en-produccion
          ENTORNO: desarrollo

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm exec tsc --noEmit -p tsconfig.app.json

      - name: Tests
        run: pnpm test

      - name: Compila
        run: pnpm build
